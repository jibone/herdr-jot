<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root {
    --fg: #ecece8; --muted: #a6a7a2; --mint: #7fe0b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 880px; height: 540px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--fg); -webkit-font-smoothing: antialiased; position: relative;
    background:
      radial-gradient(60% 70% at 8% 18%, rgba(127,224,184,.16) 0%, rgba(127,224,184,0) 70%),
      radial-gradient(55% 60% at 92% 95%, rgba(223,194,126,.10) 0%, rgba(223,194,126,0) 70%),
      #101113;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px);
    background-size: 18px 18px;
    -webkit-mask-image: linear-gradient(100deg, #000 0%, rgba(0,0,0,.55) 45%, transparent 75%);
  }

  .copy { position: absolute; left: 48px; top: 150px; width: 410px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: .6px;
    text-transform: uppercase; color: var(--mint); padding: 4px 10px 4px 8px; border-radius: 999px;
    background: rgba(127,224,184,.08); box-shadow: inset 0 0 0 1px rgba(127,224,184,.25); }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); }
  h1 { margin-top: 22px; font-size: 46px; line-height: 48px; font-weight: 750; letter-spacing: -1.6px; }
  h1 em { font-style: normal; color: var(--mint); }
  .lede { margin-top: 16px; font-size: 15.5px; line-height: 22px; color: var(--muted); width: 396px; }

  .shot {
    position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
    width: 390px; border-radius: 11px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .shot img { display: block; width: 100%; }
</style></head>
<body>
  <div class="copy">
    <span class="eyebrow"><i></i>A Herdr mod</span>
    <h1>One pad.<br>Every <em>space.</em></h1>
    <p class="lede">A "Jot" pill in Herdr's tab bar opens a free-text pane beside your terminals. The same notes in every space, saved as you type to one plain text file — and your coding agents can read and write it.</p>
  </div>

  <div class="shot"><img src="../screenshot.png" alt="Herdr running the jot pad"></div>
</body></html>
